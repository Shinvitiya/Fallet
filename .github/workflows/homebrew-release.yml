name: Publish free Homebrew release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: fallet-homebrew-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/version.py check "$GITHUB_REF_NAME"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run offline tests
        run: zsh Scripts/test.sh

      - name: Build universal ad-hoc signed app
        run: zsh build.sh

      - name: Verify both architectures and local signature
        shell: bash
        run: |
          set -euo pipefail
          lipo dist/Fallet.app/Contents/MacOS/Fallet -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/Fallet.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Fallet.app/Contents/Info.plist)" = "${GITHUB_REF_NAME#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Fallet.app/Contents/Info.plist)" = "${GITHUB_REF_NAME#v}"

  publish:
    needs: validate
    runs-on: macos-15
    permissions:
      contents: write
    env:
      FORMULA_PATH: ${{ runner.temp }}/fallet.rb
      ARCHIVE_PATH: ${{ runner.temp }}/fallet-source.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require tap credential before changing either repository
        env:
          TAP_TOKEN: ${{ secrets.FALLET_TAP_TOKEN }}
        shell: bash
        run: test -n "$TAP_TOKEN"

      - name: Pin and validate immutable source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/version.py check "$GITHUB_REF_NAME"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/Shinvitiya/Fallet/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" \
            --output "$ARCHIVE_PATH"
          checksum="$(shasum -a 256 "$ARCHIVE_PATH" | awk '{print $1}')"
          cp Formula/fallet.rb "$FORMULA_PATH"
          python3 Scripts/formula.py update "$FORMULA_PATH" "$GITHUB_REF_NAME" "$checksum" --archive "$ARCHIVE_PATH"
          python3 Scripts/formula.py verify "$FORMULA_PATH" --archive "$ARCHIVE_PATH"

      - name: Update formula for existing custom-tap users
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash Scripts/publish-formula.sh Shinvitiya/Fallet "$FORMULA_PATH" "$GITHUB_REF_NAME"

      - name: Update dedicated Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.FALLET_TAP_TOKEN }}
        shell: bash
        run: bash Scripts/publish-formula.sh Shinvitiya/homebrew-fallet "$FORMULA_PATH" "$GITHUB_REF_NAME"

      - name: Publish stable release only after both formulas are available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if state="$(gh release view "$GITHUB_REF_NAME" --repo Shinvitiya/Fallet \
              --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv' 2>/dev/null)"; then
            if [[ "$state" == $'false\tfalse' ]]; then
              echo "Stable release already published"
            elif [[ "$state" == $'true\tfalse' ]]; then
              gh release edit "$GITHUB_REF_NAME" --repo Shinvitiya/Fallet --draft=false --latest
            else
              echo "Existing release is a prerelease; refusing to advertise it" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo Shinvitiya/Fallet \
              --verify-tag --latest --title "Fallet $GITHUB_REF_NAME" --generate-notes
          fi
          published="$(gh release view "$GITHUB_REF_NAME" --repo Shinvitiya/Fallet \
            --json isDraft,isPrerelease,tagName \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          test "$published" = "$GITHUB_REF_NAME"
