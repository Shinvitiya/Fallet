name: Optional notarized macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to attach the notarized DMG to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 Scripts/version.py check "$RELEASE_TAG"

      - name: Import Developer ID certificate and notary key
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.FALLET_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.FALLET_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.FALLET_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Missing Developer ID certificate secret}"
          : "${CERTIFICATE_P12_PASSWORD:?Missing certificate password secret}"
          : "${NOTARY_KEY_BASE64:?Missing App Store Connect API key secret}"
          certificate="$RUNNER_TEMP/fallet-developer-id.p12"
          notary_key="$RUNNER_TEMP/fallet-notary.p8"
          keychain="$RUNNER_TEMP/fallet-release.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          test -s "$certificate"
          test -s "$notary_key"
          chmod 600 "$certificate" "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build, sign, notarize, staple, and verify
        shell: bash
        env:
          FALLET_SIGNING_IDENTITY: ${{ secrets.FALLET_SIGNING_IDENTITY }}
          FALLET_NOTARY_KEY_PATH: ${{ runner.temp }}/fallet-notary.p8
          FALLET_NOTARY_KEY_ID: ${{ secrets.FALLET_NOTARY_KEY_ID }}
          FALLET_NOTARY_ISSUER_ID: ${{ secrets.FALLET_NOTARY_ISSUER_ID }}
        run: zsh package-dmg.sh

      - name: Attach notarized DMG to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/Fallet-*-macOS-universal.dmg dist/Fallet-*-macOS-universal.dmg.sha256 \
            --repo Shinvitiya/Fallet --clobber

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/fallet-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/fallet-developer-id.p12" "$RUNNER_TEMP/fallet-notary.p8"
